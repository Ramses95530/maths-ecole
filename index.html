<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM1 & CM2 — Révisions</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f1f8;--surface:#fff;--surface2:#faf8fc;--border:#e2dcea;
  --text:#1e1a2e;--text2:#6b6480;--text3:#a89fc0;
  --cm1:#d4622a;--cm1l:#fdf0e8;--cm1d:#a8461a;
  --cm2:#2e7abf;--cm2l:#e8f2fb;--cm2d:#1a5a96;
  --ma:#d4622a;--mal:#fdf0e8;--mad:#a8461a;
  --fr:#8b3ab8;--frl:#f4eafb;--frd:#6a2690;
  --hi:#b8602a;--hil:#fdf2ea;--hid:#8a3e14;
  --ge:#2a9e6e;--gel:#e8f8f2;--ged:#1a7850;
  --ok:#2eaa6e;--okl:#e6f7f0;
  --ko:#e04848;--kol:#fdeaea;
  --r:14px;--rs:8px;--sh:0 2px 12px rgba(0,0,0,.07);--shl:0 8px 32px rgba(0,0,0,.12)
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{background:var(--surface);border-bottom:2px solid var(--border);padding:.85rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.logo{font-family:'Baloo 2',cursive;font-size:1.5rem;font-weight:800}
.logo .c1{color:var(--cm1)}.logo .c2{color:var(--cm2)}.logo .sep{color:var(--text3);font-size:.9rem;margin:0 4px}
.score-bar{display:flex;gap:8px}
.spill{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:50px;font-size:13px;font-weight:700;border:1.5px solid var(--border);background:var(--surface2)}
.spill.ok{border-color:var(--ok);color:var(--ok);background:var(--okl)}
.spill.ko{border-color:var(--ko);color:var(--ko);background:var(--kol)}

/* LEVEL BAR */
.lvl-bar{display:flex;background:var(--surface);border-bottom:2px solid var(--border)}
.lvl-btn{flex:1;padding:11px;font-family:'Baloo 2',cursive;font-size:1rem;font-weight:700;border:none;cursor:pointer;background:transparent;color:var(--text3);position:relative;transition:color .2s}
.lvl-btn::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:3px;border-radius:3px 3px 0 0;background:transparent;transition:background .2s}
.lvl-btn.cm1{color:var(--cm1)}.lvl-btn.cm1::after{background:var(--cm1)}
.lvl-btn.cm2{color:var(--cm2)}.lvl-btn.cm2::after{background:var(--cm2)}

/* MATIERE TABS */
.mat-row{display:flex;gap:6px;margin-bottom:1rem}
.mat-btn{flex:1;padding:9px 6px;font-family:'Baloo 2',cursive;font-size:.9rem;font-weight:700;border:1.5px solid var(--border);border-radius:var(--rs);cursor:pointer;background:var(--surface);color:var(--text2);transition:all .18s;text-align:center}
.mat-btn.ma{color:var(--ma)}.mat-btn.active-ma{background:var(--mal);border-color:var(--ma);color:var(--mad)}
.mat-btn.fr{color:var(--fr)}.mat-btn.active-fr{background:var(--frl);border-color:var(--fr);color:var(--frd)}
.mat-btn.hi{color:var(--hi)}.mat-btn.active-hi{background:var(--hil);border-color:var(--hi);color:var(--hid)}
.mat-btn.ge{color:var(--ge)}.mat-btn.active-ge{background:var(--gel);border-color:var(--ge);color:var(--ged)}

/* CAT PILLS */
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.cat-pill{padding:6px 13px;border-radius:50px;font-size:12px;font-weight:700;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .18s}
.cat-pill.active-ma{background:var(--mal);border-color:var(--ma);color:var(--mad)}
.cat-pill.active-fr{background:var(--frl);border-color:var(--fr);color:var(--frd)}
.cat-pill.active-hi{background:var(--hil);border-color:var(--hi);color:var(--hid)}
.cat-pill.active-ge{background:var(--gel);border-color:var(--ge);color:var(--ged)}

/* QUESTION CARD */
.q-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:1.5rem;box-shadow:var(--sh);animation:si .25s ease}
@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.q-num{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.prog-wrap{flex:1;height:6px;background:var(--bg);border-radius:6px;margin:0 12px;overflow:hidden}
.prog-fill{height:100%;border-radius:6px;transition:width .4s}
.fill-ma{background:var(--ma)}.fill-fr{background:var(--fr)}.fill-hi{background:var(--hi)}.fill-ge{background:var(--ge)}
.q-cat-label{font-size:11px;font-weight:700;color:var(--text3)}
.q-text{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:1.25rem;line-height:1.5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:1.1rem}
.ch-btn{padding:12px 10px;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:700;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--surface2);color:var(--text);cursor:pointer;transition:all .18s;text-align:center;line-height:1.3}
.ch-btn:hover:not(:disabled){border-color:var(--text3);background:var(--surface);transform:translateY(-1px);box-shadow:var(--sh)}
.ch-btn:disabled{cursor:default}
.ch-btn.correct{background:var(--okl);border-color:var(--ok);color:var(--ok)}
.ch-btn.wrong{background:var(--kol);border-color:var(--ko);color:var(--ko);text-decoration:line-through}
.ch-btn.reveal{background:var(--okl);border-color:var(--ok);color:var(--ok);opacity:.6}
.feedback{border-radius:var(--rs);padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:1rem;display:none}
.feedback.ok{display:block;background:var(--okl);color:var(--ok);border:1px solid var(--ok)}
.feedback.ko{display:block;background:var(--kol);color:var(--ko);border:1px solid var(--ko)}
.nav-row{display:flex;gap:9px;align-items:center}
.btn{padding:8px 18px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;border-radius:50px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .18s}
.btn:hover{border-color:var(--text3);color:var(--text)}
.btn.p-ma{background:var(--ma);border-color:var(--ma);color:#fff}.btn.p-ma:hover{background:var(--mad);border-color:var(--mad)}
.btn.p-fr{background:var(--fr);border-color:var(--fr);color:#fff}.btn.p-fr:hover{background:var(--frd);border-color:var(--frd)}
.btn.p-hi{background:var(--hi);border-color:var(--hi);color:#fff}.btn.p-hi:hover{background:var(--hid);border-color:var(--hid)}
.btn.p-ge{background:var(--ge);border-color:var(--ge);color:#fff}.btn.p-ge:hover{background:var(--ged);border-color:var(--ged)}

/* RESULT */
.res-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:2.5rem 1.5rem;text-align:center;box-shadow:var(--shl);animation:si .3s ease}
.res-emoji{font-size:3.5rem;margin-bottom:.75rem}
.res-score{font-family:'Baloo 2',cursive;font-size:2.8rem;font-weight:800}
.res-score.ma{color:var(--ma)}.res-score.fr{color:var(--fr)}.res-score.hi{color:var(--hi)}.res-score.ge{color:var(--ge)}
.res-pct{font-size:13px;color:var(--text3);margin:4px 0 6px;font-weight:700}
.res-msg{font-size:1rem;font-weight:700;color:var(--text2);margin-bottom:1.75rem}
.res-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* HOME */
.home-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:2rem;box-shadow:var(--sh)}
.home-title{font-family:'Baloo 2',cursive;font-size:1.7rem;font-weight:800;margin-bottom:.3rem}
.home-sub{color:var(--text2);font-size:.9rem;margin-bottom:1.5rem}
.lvl-cards{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.lvl-card{border:2px solid var(--border);border-radius:var(--r);padding:1.5rem 1rem;cursor:pointer;transition:all .2s;background:var(--surface2);text-align:center}
.lvl-card:hover{transform:translateY(-2px);box-shadow:var(--shl)}
.lvl-card.l1{border-color:var(--cm1);background:var(--cm1l)}.lvl-card.l2{border-color:var(--cm2);background:var(--cm2l)}
.lvl-card-lbl{font-family:'Baloo 2',cursive;font-size:1.8rem;font-weight:800}
.l1 .lvl-card-lbl{color:var(--cm1)}.l2 .lvl-card-lbl{color:var(--cm2)}
.lvl-card-desc{font-size:12px;color:var(--text2);margin-top:4px}

.main{max-width:680px;margin:0 auto;padding:1.5rem}

@media(max-width:500px){
  header{padding:.7rem 1rem}
  .logo{font-size:1.2rem}
  .choices{grid-template-columns:1fr}
  .lvl-cards{grid-template-columns:1fr}
  .mat-btn{font-size:.78rem;padding:7px 3px}
  .q-text{font-size:1.05rem}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="c1">CM1</span><span class="sep">&</span><span class="c2">CM2</span>
    <span style="font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;color:var(--text3);margin-left:8px">Révisions</span>
  </div>
  <div class="score-bar">
    <div class="spill ok">✓ <span id="sok">0</span></div>
    <div class="spill ko">✗ <span id="sko">0</span></div>
  </div>
</header>

<div id="lvlbar" style="display:none">
  <div class="lvl-bar">
    <button class="lvl-btn" id="bcm1" onclick="setLevel('cm1')">CM1</button>
    <button class="lvl-btn" id="bcm2" onclick="setLevel('cm2')">CM2</button>
  </div>
</div>

<div class="main" id="main"></div>

        {q:"Sur quel continent se trouve l'Égypte ?",c:["Asie","Afrique","Europe","Amérique"],a:1},
        {q:"Plus long fleuve du monde ?",c:["Le Nil","L'Amazone","Le Yangtsé","Le Mississippi"],a:0},
        {q:"Sur quel continent se trouve la Chine ?",c:["Afrique","Europe","Asie","Océanie"],a:2},
        {q:"Capitale des États-Unis ?",c:["New York","Los Angeles","Chicago","Washington D.C."],a:3},
        {q:"Plus grand désert du monde ?",c:["Le Sahara","Le Gobi","L'Atacama","Le désert d'Arabie"],a:0},
        {q:"Capitale du Brésil ?",c:["Rio de Janeiro","São Paulo","Brasília","Salvador"],a:2},
      ],
    },
  }
};

const MATS = {maths:{label:"Maths",id:"ma"},francais:{label:"Français",id:"fr"},histoire:{label:"Histoire",id:"hi"},geographie:{label:"Géographie",id:"ge"}};

// ==================== STATE ====================
let S = {view:"home",level:null,mat:"maths",cat:"",questions:[],qi:0,answered:false,scoreOk:0,scoreKo:0};

function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

function getCats(){return Object.keys(D[S.level][S.mat])}

function render(){
  document.getElementById("sok").textContent=S.scoreOk;
  document.getElementById("sko").textContent=S.scoreKo;
  const lb=document.getElementById("lvlbar");
  const main=document.getElementById("main");
  if(S.view==="home"){lb.style.display="none";renderHome(main);return}
  lb.style.display="block";
  document.getElementById("bcm1").className="lvl-btn"+(S.level==="cm1"?" cm1":"");
  document.getElementById("bcm2").className="lvl-btn"+(S.level==="cm2"?" cm2":"");
  if(S.view==="result"){renderResult(main);return}
  renderQuiz(main);
}

function renderHome(main){
  main.innerHTML=`<div class="home-card">
    <div class="home-title">CM1 &amp; CM2 — Révisions</div>
    <div class="home-sub">Maths · Français · Histoire · Géographie — Choisis ton niveau !</div>
    <div class="lvl-cards">
      <div class="lvl-card l1" onclick="chooseLevel('cm1')"><div class="lvl-card-lbl">CM1</div><div class="lvl-card-desc">4 matières · 5 thèmes chacune</div></div>
      <div class="lvl-card l2" onclick="chooseLevel('cm2')"><div class="lvl-card-lbl">CM2</div><div class="lvl-card-desc">4 matières · 5 thèmes chacune</div></div>
    </div>
  </div>`;
}

function renderQuiz(main){
  const mid=MATS[S.mat].id;
  const cats=getCats();
  const q=S.questions[S.qi];
  const pct=Math.round((S.qi/S.questions.length)*100);

  const matHtml=Object.entries(MATS).map(([k,v])=>`<button class="mat-btn ${v.id}${S.mat===k?" active-"+v.id:""}" onclick="setMat('${k}')">${v.label}</button>`).join("");
  const catHtml=cats.map(k=>`<button class="cat-pill${S.cat===k?" active-"+mid:""}" onclick="setCat('${k}')">${k}</button>`).join("");
  const chHtml=q.c.map((c,i)=>`<button class="ch-btn" id="ch${i}" onclick="answer(${i})">${c}</button>`).join("");

  main.innerHTML=`
    <div class="mat-row">${matHtml}</div>
    <div class="cat-row">${catHtml}</div>
    <div class="q-card">
      <div class="q-meta">
        <div class="q-num">Q ${S.qi+1} / ${S.questions.length}</div>
        <div class="prog-wrap"><div class="prog-fill fill-${mid}" style="width:${pct}%"></div></div>
        <div class="q-cat-label">${S.cat}</div>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="choices">${chHtml}</div>
      <div class="feedback" id="fb"></div>
      <div class="nav-row">
        <button class="btn" onclick="home()">← Menu</button>
        <button class="btn p-${mid}" id="nxt" style="display:none" onclick="nextQ()">Question suivante →</button>
      </div>
    </div>`;
}

function renderResult(main){
  const mid=MATS[S.mat].id;
  const total=S.questions.length;
  const pct=Math.round((S.scoreOk/total)*100);
  const emoji=pct>=80?"🌟":pct>=60?"👍":pct>=40?"💪":"📚";
  const msg=pct>=80?"Excellent, bravo !":pct>=60?"Bien joué, continue !":pct>=40?"Pas mal, entraîne-toi encore !":"Courage, tu vas progresser !";
  main.innerHTML=`<div class="res-card">
    <div class="res-emoji">${emoji}</div>
    <div class="res-score ${mid}">${S.scoreOk} / ${total}</div>
    <div class="res-pct">${pct}% de bonnes réponses · ${S.cat}</div>
    <div class="res-msg">${msg}</div>
    <div class="res-btns">
      <button class="btn p-${mid}" onclick="restartSame()">Recommencer</button>
      <button class="btn" onclick="home()">Changer de thème</button>
    </div>
  </div>`;
}

// ==================== ACTIONS ====================
function chooseLevel(lv){
  S.level=lv;S.mat="maths";S.scoreOk=0;S.scoreKo=0;
  S.cat=getCats()[0];
  loadQ();S.view="quiz";render();
}
function setLevel(lv){
  S.level=lv;S.scoreOk=0;S.scoreKo=0;
  S.cat=getCats()[0];
  loadQ();S.view="quiz";render();
}
function setMat(m){
  S.mat=m;S.scoreOk=0;S.scoreKo=0;
  S.cat=Object.keys(D[S.level][m])[0];
  loadQ();S.view="quiz";render();
}
function setCat(c){
  S.cat=c;S.scoreOk=0;S.scoreKo=0;
  loadQ();S.view="quiz";render();
}
function loadQ(){
  S.questions=shuffle(D[S.level][S.mat][S.cat]).slice(0,6);
  S.qi=0;S.answered=false;
}
function answer(idx){
  if(S.answered)return;
  S.answered=true;
  const q=S.questions[S.qi];
  const fb=document.getElementById("fb");
  document.querySelectorAll(".ch-btn").forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a&&i!==idx)b.classList.add("reveal");
  });
  if(idx===q.a){
    document.getElementById("ch"+idx).classList.add("correct");
    fb.className="feedback ok";fb.textContent="✓ Bravo, bonne réponse !";
    S.scoreOk++;
  }else{
    document.getElementById("ch"+idx).classList.add("wrong");
    fb.className="feedback ko";fb.textContent="✗ Pas tout à fait. La bonne réponse était : "+q.c[q.a];
    S.scoreKo++;
  }
  document.getElementById("sok").textContent=S.scoreOk;
  document.getElementById("sko").textContent=S.scoreKo;
  document.getElementById("nxt").style.display="";
}
function nextQ(){
  S.qi++;S.answered=false;
  if(S.qi>=S.questions.length){S.view="result";}
  render();
}
function restartSame(){S.scoreOk=0;S.scoreKo=0;loadQ();S.view="quiz";render();}
function home(){S.view="home";render();}

render();
</script>
</body>
</html>
