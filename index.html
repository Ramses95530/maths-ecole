body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:2px solid var(--border);padding:.8rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.logo{font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:800}
.logo .gs{color:var(--gs)}.logo .cp{color:var(--cp)}.logo .cm1c{color:var(--cm1)}.logo .cm2c{color:var(--cm2)}
.logo .sep{color:var(--text3);font-size:.8rem;margin:0 3px}
.score-bar{display:flex;gap:7px}
.score-pill{display:flex;align-items:center;gap:4px;padding:4px 11px;border-radius:50px;font-size:13px;font-weight:700;border:1.5px solid var(--border);background:var(--surface2)}
.score-pill.ok{border-color:var(--green);color:var(--green);background:var(--green-l)}
.score-pill.ko{border-color:var(--red);color:var(--red);background:var(--red-l)}
.main{max-width:680px;margin:0 auto;padding:1.5rem 1.25rem}
.home-title{font-family:'Baloo 2',cursive;font-size:1.6rem;font-weight:800;text-align:center;margin-bottom:.3rem}
.home-sub{color:var(--text2);font-size:.95rem;text-align:center;margin-bottom:1.5rem}
.level-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
.level-card{border:2px solid var(--border);border-radius:var(--radius);padding:1.25rem 1rem;cursor:pointer;transition:all .2s;background:var(--surface);text-align:center}
.level-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.level-card.gs{border-color:var(--gs);background:var(--gs-l)}
.level-card.cp{border-color:var(--cp);background:var(--cp-l)}
.level-card.cm1{border-color:var(--cm1);background:var(--cm1-l)}
.level-card.cm2{border-color:var(--cm2);background:var(--cm2-l)}

.level-desc{font-size:11px;color:var(--text2);margin-top:3px}
.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.subject-card{border:2px solid var(--border);border-radius:var(--radius);padding:1.25rem 1rem;cursor:pointer;transition:all .2s;background:var(--surface);text-align:center}

.s-lbl{font-family:'Baloo 2',cursive;font-size:1.05rem;font-weight:800}
.subject-card.ma{border-color:var(--ma)}.subject-card.ma .s-lbl{color:var(--ma)}
.subject-card.fr{border-color:var(--fr)}.subject-card.fr .s-lbl{color:var(--fr)}
.subject-card.ev{border-color:var(--ev)}.subject-card.ev .s-lbl{color:var(--ev)}
.subject-card.hi{border-color:var(--hi)}.subject-card.hi .s-lbl{color:var(--hi)}
.subject-card.ge{border-color:var(--ge)}.subject-card.ge .s-lbl{color:var(--ge)}
.subject-card.frcm{border-color:var(--frcm)}.subject-card.frcm .s-lbl{color:var(--frcm)}
.s-desc{font-size:11px;color:var(--text2);margin-top:2px}
.cat-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1.25rem}

.q-emoji{font-size:3.5rem;text-align:center;margin-bottom:.75rem}

// ============================================================
//  SYNTHÈSE VOCALE
// ============================================================
let currentUtterance = null;
let isSpeaking = false;

function speak(text, onEnd) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "fr-FR";
  u.rate = 0.85;
  u.pitch = 1.1;
  u.onend = () => { isSpeaking = false; if (onEnd) onEnd(); };
  u.onerror = () => { isSpeaking = false; };
  isSpeaking = true;
  currentUtterance = u;
  window.speechSynthesis.speak(u);
}

function stopSpeech() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  isSpeaking = false;
}

// Lit la question + les réponses enchaînées (mode GS/CP)
function readQuestion(q) {
  // On nettoie les emojis pour la lecture
  const clean = (str) => str.replace(/[\u{1F300}-\u{1FFFF}]/gu, '').replace(/[→]/g,'').trim();
  const qText = clean(q.q);
  const choices = q.ch.map((c,i) => `${['A','B','C','D'][i]} : ${clean(c)}`).join('. ');
  speak(qText + '. ' + choices);
  // Animer le bouton
  const btn = document.getElementById("read-btn");
  if (btn) { btn.classList.add("speaking"); setTimeout(()=>{ if(btn) btn.classList.remove("speaking"); }, 4000); }
}

function speakChoice(text) {
  const clean = text.replace(/[\u{1F300}-\u{1FFFF}]/gu, '').replace(/[→]/g,'').trim();
  speak(clean);
}

let S={view:"home",level:null,subject:null,cat:null,questions:[],qIndex:0,answered:false,scoreOk:0,scoreKo:0};
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function isVocal(){return S.level && LEVELS[S.level].vocal}

// ============================================================
//  RENDER
// ============================================================
function render(){
  stopSpeech();
  document.getElementById("score-ok").textContent=S.scoreOk;
  document.getElementById("score-ko").textContent=S.scoreKo;
  const m=document.getElementById("main");
  if(S.view==="home"){renderHome(m);return}
  if(S.view==="subject"){renderSubject(m);return}
  if(S.view==="result"){renderResult(m);return}
  renderQuiz(m);
  // Auto-lecture pour GS/CP
  if(isVocal()){
    setTimeout(()=>readQuestion(S.questions[S.qIndex]),400);
  }
}

function renderHome(m){
  m.innerHTML=`
    <div class="home-title">Mon École 🏫</div>
    <div class="home-sub">Choisis ton niveau pour commencer</div>
    <div class="level-grid">
      ${Object.entries(LEVELS).map(([k,v])=>`
        <div class="level-card ${k}" onclick="goLevel('${k}')">
          <div class="level-lbl">${v.label}</div>
          <div class="level-desc">${Object.keys(v.subjects).length} matières</div>
          ${v.vocal?'<div class="sound-badge">🔊 Lecture à voix haute</div>':''}
        </div>`).join("")}
    </div>`;
}

function renderSubject(m){
  const lv=LEVELS[S.level];
  m.innerHTML=`
    <div class="breadcrumb">
      <span class="bc-item" onclick="home()">Accueil</span>
      <span class="bc-sep">›</span>
      <span class="bc-current">${lv.label}</span>
    </div>
    <div class="home-sub">Quelle matière ?</div>
    <div class="subject-grid">
      ${Object.entries(lv.subjects).map(([k,v])=>`
        <div class="subject-card ${k}" onclick="goSubject('${k}')">
          <div class="s-icon">${v.icon}</div>
          <div class="s-lbl">${v.label}</div>
          <div class="s-desc">${Object.keys(v.cats).length} thèmes</div>
        </div>`).join("")}
    </div>`;
}

function catPillsHtml(){
  const cats=LEVELS[S.level].subjects[S.subject].cats;
  return Object.entries(cats).map(([k,v])=>`
    <button class="cat-pill" onclick="goCat('${k}')"
      style="${S.cat===k?`background:var(--${S.subject}-l);border-color:var(--${S.subject});color:var(--${S.subject}-d)`:''}"
    >${v}</button>`).join("");
}

function renderQuiz(m){
  const lv=LEVELS[S.level];
  const sub=lv.subjects[S.subject];
  const qs=S.questions; const q=qs[S.qIndex];
  const pct=Math.round(S.qIndex/qs.length*100);
  const vocal=lv.vocal;

  const choicesHtml = vocal
    ? q.ch.map((c,i)=>`
        <button class="choice-btn" id="ch${i}" onclick="answerAndSpeak(${i},'${c.replace(/'/g,"\\'")}')">
          <span class="choice-text">${c}</span>
          <span class="speak-ico">🔊</span>
        </button>`).join("")
    : q.ch.map((c,i)=>`
        <button class="choice-btn" id="ch${i}" onclick="answer(${i})">${c}</button>`).join("");

  m.innerHTML=`
    <div class="breadcrumb">
      <span class="bc-item" onclick="home()">Accueil</span>
      <span class="bc-sep">›</span>
      <span class="bc-item" onclick="goLevel('${S.level}')">${lv.label}</span>
      <span class="bc-sep">›</span>
      <span class="bc-current">${sub.label}</span>
    </div>
    <div class="cat-row">${catPillsHtml()}</div>
    <div class="q-card">
      <div class="q-meta">
        <div class="q-num">Q ${S.qIndex+1}/${qs.length}</div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%;background:var(--${S.subject})"></div></div>
        <div class="q-badge">${sub.cats[S.cat]}</div>
      </div>
      ${vocal?`
        <button class="sound-btn" id="read-btn" onclick="readQuestion(S.questions[S.qIndex])">
          <span class="sound-icon">🔊</span>
          <span>${q.q}</span>
        </button>`
        :`${q.e?`<div class="q-emoji">${q.e}</div>`:''}
        <div class="q-text">${q.q}</div>`}
      ${vocal && q.e?`<div class="q-emoji" style="font-size:2.5rem;margin-bottom:.5rem">${q.e}</div>`:''}
      <div class="choices${vocal?' big':''}">
        ${choicesHtml}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <button class="btn" onclick="goLevel('${S.level}')">← Matières</button>
        <button class="btn p-${S.subject}" id="next-btn" style="display:none" onclick="nextQ()">Suivant →</button>
      </div>
    </div>`;
}

function renderResult(m){
  const sub=LEVELS[S.level].subjects[S.subject];
  const total=S.questions.length; const ok=S.scoreOk;
  const pct=Math.round(ok/total*100);
  const emoji=pct>=80?"🌟":pct>=60?"👍":pct>=40?"💪":"📚";
  const msg=pct>=80?"Excellent, bravo !":pct>=60?"Bien joué, continue !":pct>=40?"Pas mal, continue !":"Courage, tu vas progresser !";
  if(isVocal()) speak(msg);
  m.innerHTML=`
    <div class="breadcrumb">
      <span class="bc-item" onclick="home()">Accueil</span>
      <span class="bc-sep">›</span>
      <span class="bc-item" onclick="goLevel('${S.level}')">${LEVELS[S.level].label}</span>
      <span class="bc-sep">›</span>
      <span class="bc-current">${sub.label}</span>
    </div>
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score" style="color:var(--${S.subject})">${ok} / ${total}</div>
      <div class="result-pct">${pct}% · ${sub.cats[S.cat]}</div>
      <div class="result-msg">${msg}</div>
      <div class="result-btns">
        <button class="btn p-${S.subject}" onclick="restartSame()">Recommencer</button>
        <button class="btn" onclick="goLevel('${S.level}')">Changer de matière</button>
        <button class="btn" onclick="home()">Accueil</button>
      </div>
    </div>`;
}

// ============================================================
//  ACTIONS
// ============================================================
function home(){S.view="home";render()}
function goLevel(lv){S.level=lv;S.view="subject";render()}
function goSubject(sub){S.subject=sub;const firstCat=Object.keys(LEVELS[S.level].subjects[sub].cats)[0];goCat(firstCat)}
function goCat(cat){
  S.cat=cat;S.scoreOk=0;S.scoreKo=0;
  S.questions=shuffle(DATA[S.level][S.subject][cat]).slice(0,6);
  S.qIndex=0;S.answered=false;S.view="quiz";render();
}

function answerAndSpeak(idx, text) {
  speakChoice(text);
  setTimeout(()=>answer(idx), 600);
}

function answer(idx){
  if(S.answered)return; S.answered=true;
  const q=S.questions[S.qIndex]; const correct=q.a;
  document.querySelectorAll(".choice-btn").forEach((btn,i)=>{
    btn.disabled=true;
    if(i===correct&&i!==idx)btn.classList.add("reveal");
  });
  const fb=document.getElementById("feedback");
  if(idx===correct){
    document.getElementById("ch"+idx).classList.add("correct");
    fb.className="feedback ok";
    fb.textContent="✓ Bravo, bonne réponse !";
    S.scoreOk++;
    if(isVocal()) setTimeout(()=>speak("Bravo ! Bonne réponse !"),300);
  } else {
    document.getElementById("ch"+idx).classList.add("wrong");
    fb.className="feedback ko";
    fb.textContent="✗ La bonne réponse était : "+q.ch[correct];
    S.scoreKo++;
    if(isVocal()) setTimeout(()=>speak("La bonne réponse était : "+q.ch[correct]),300);
  }
  document.getElementById("score-ok").textContent=S.scoreOk;
  document.getElementById("score-ko").textContent=S.scoreKo;
  document.getElementById("next-btn").style.display="";
}

function nextQ(){S.qIndex++;S.answered=false;if(S.qIndex>=S.questions.length)S.view="result";render()}
function restartSame(){S.scoreOk=0;S.scoreKo=0;S.questions=shuffle(DATA[S.level][S.subject][S.cat]).slice(0,6);S.qIndex=0;S.answered=false;S.view="quiz";render()}
render();
</script>
</body>
</html>
