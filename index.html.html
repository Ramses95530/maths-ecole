<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths CM1 & CM2 — Entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0eb;
    --surface: #ffffff;
    --surface2: #fdf8f3;
    --border: #e8e0d6;
    --text: #2c2420;
    --text2: #7a6f6a;
    --text3: #a89f9a;
    --accent-cm1: #e07b39;
    --accent-cm1-light: #fdf0e6;
    --accent-cm1-dark: #b85e20;
    --accent-cm2: #3a8fcd;
    --accent-cm2-light: #e6f3fc;
    --accent-cm2-dark: #1e6fa8;
    --green: #2eaa6e;
    --green-light: #e6f7f0;
    --red: #e04848;
    --red-light: #fdeaea;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* ---- HEADER ---- */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .logo {
    font-family: 'Baloo 2', cursive;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo span.cm1 { color: var(--accent-cm1); }
  .logo span.cm2 { color: var(--accent-cm2); }
  .logo span.et { color: var(--text3); font-size: 1rem; margin: 0 4px; }

  .score-bar {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .score-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    border: 1.5px solid var(--border);
    background: var(--surface2);
  }
  .score-pill.ok { border-color: var(--green); color: var(--green); background: var(--green-light); }
  .score-pill.ko { border-color: var(--red); color: var(--red); background: var(--red-light); }
  .score-dot { width: 8px; height: 8px; border-radius: 50%; }
  .score-dot.ok { background: var(--green); }
  .score-dot.ko { background: var(--red); }

  /* ---- LEVEL TABS ---- */
  .level-selector {
    display: flex;
    gap: 0;
    background: var(--surface);
    border-bottom: 2px solid var(--border);
  }
  .level-btn {
    flex: 1;
    padding: 14px 1rem;
    font-family: 'Baloo 2', cursive;
    font-size: 1.05rem;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: var(--text3);
    position: relative;
  }
  .level-btn::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0; right: 0;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: transparent;
    transition: background 0.2s;
  }
  .level-btn.cm1 { color: var(--accent-cm1); }
  .level-btn.cm1::after { background: var(--accent-cm1); }
  .level-btn.cm2 { color: var(--accent-cm2); }
  .level-btn.cm2::after { background: var(--accent-cm2); }
  .level-btn:not(.cm1):not(.cm2) { color: var(--text3); }
  .level-btn:not(.cm1):not(.cm2):hover { color: var(--text2); }

  /* ---- MAIN LAYOUT ---- */
  .main {
    max-width: 680px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* ---- CATEGORY PILLS ---- */
  .cat-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .cat-pill {
    padding: 7px 16px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.18s;
  }
  .cat-pill:hover { border-color: var(--text3); color: var(--text); }
  .cat-pill.active-cm1 { background: var(--accent-cm1-light); border-color: var(--accent-cm1); color: var(--accent-cm1-dark); }
  .cat-pill.active-cm2 { background: var(--accent-cm2-light); border-color: var(--accent-cm2); color: var(--accent-cm2-dark); }

  /* ---- QUESTION CARD ---- */
  .q-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    box-shadow: var(--shadow);
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .q-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--text3);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .progress-wrap {
    flex: 1;
    height: 6px;
    background: var(--bg);
    border-radius: 6px;
    margin: 0 14px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .fill-cm1 { background: var(--accent-cm1); }
  .fill-cm2 { background: var(--accent-cm2); }

  .q-text {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 1.5rem;
    line-height: 1.45;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  .choice-btn {
    padding: 14px 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    transition: all 0.18s;
    text-align: center;
    line-height: 1.3;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--text3); background: var(--surface); transform: translateY(-1px); box-shadow: var(--shadow); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { background: var(--green-light); border-color: var(--green); color: var(--green); }
  .choice-btn.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); text-decoration: line-through; }
  .choice-btn.reveal { background: var(--green-light); border-color: var(--green); color: var(--green); opacity: 0.7; }

  /* ---- FEEDBACK ---- */
  .feedback {
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 1rem;
    display: none;
  }
  .feedback.ok { display: block; background: var(--green-light); color: var(--green); border: 1px solid var(--green); }
  .feedback.ko { display: block; background: var(--red-light); color: var(--red); border: 1px solid var(--red); }

  /* ---- NAV ---- */
  .nav-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn {
    padding: 10px 22px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    border-radius: 50px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn:hover { border-color: var(--text3); color: var(--text); background: var(--surface2); }
  .btn.primary-cm1 { background: var(--accent-cm1); border-color: var(--accent-cm1); color: #fff; }
  .btn.primary-cm1:hover { background: var(--accent-cm1-dark); border-color: var(--accent-cm1-dark); }
  .btn.primary-cm2 { background: var(--accent-cm2); border-color: var(--accent-cm2); color: #fff; }
  .btn.primary-cm2:hover { background: var(--accent-cm2-dark); border-color: var(--accent-cm2-dark); }

  /* ---- RESULT ---- */
  .result-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 3rem 2rem;
    text-align: center;
    box-shadow: var(--shadow-lg);
    animation: slideIn 0.3s ease;
  }
  .result-emoji { font-size: 4rem; margin-bottom: 1rem; }
  .result-score { font-family: 'Baloo 2', cursive; font-size: 3rem; font-weight: 800; }
  .result-score.cm1 { color: var(--accent-cm1); }
  .result-score.cm2 { color: var(--accent-cm2); }
  .result-pct { font-size: 15px; color: var(--text3); margin: 4px 0 8px; font-weight: 700; }
  .result-msg { font-size: 1.1rem; font-weight: 700; color: var(--text2); margin-bottom: 2rem; }
  .result-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* ---- ACCUEIL ---- */
  .home-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .home-title { font-family: 'Baloo 2', cursive; font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
  .home-sub { color: var(--text2); font-size: 1rem; margin-bottom: 2rem; }
  .level-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .level-card {
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem 1rem;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface2);
  }
  .level-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .level-card.l-cm1 { border-color: var(--accent-cm1); background: var(--accent-cm1-light); }
  .level-card.l-cm2 { border-color: var(--accent-cm2); background: var(--accent-cm2-light); }
  .level-card-label { font-family: 'Baloo 2', cursive; font-size: 1.8rem; font-weight: 800; }
  .level-card.l-cm1 .level-card-label { color: var(--accent-cm1); }
  .level-card.l-cm2 .level-card-label { color: var(--accent-cm2); }
  .level-card-desc { font-size: 13px; color: var(--text2); margin-top: 4px; }

  @media (max-width: 500px) {
    header { padding: 0.75rem 1rem; }
    .logo { font-size: 1.2rem; }
    .choices { grid-template-columns: 1fr; }
    .level-cards { grid-template-columns: 1fr; }
    .main { padding: 1rem; }
    .q-text { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="cm1">CM1</span>
    <span class="et">&</span>
    <span class="cm2">CM2</span>
    <span style="font-family:'Nunito',sans-serif;font-size:1rem;font-weight:600;color:var(--text3);margin-left:8px">Maths</span>
  </div>
  <div class="score-bar">
    <div class="score-pill ok"><div class="score-dot ok"></div><span id="score-ok">0</span></div>
    <div class="score-pill ko"><div class="score-dot ko"></div><span id="score-ko">0</span></div>
  </div>
</header>

<div id="level-bar" style="display:none">
  <div class="level-selector">
    <button class="level-btn" id="btn-cm1" onclick="setLevel('cm1')">CM1</button>
    <button class="level-btn" id="btn-cm2" onclick="setLevel('cm2')">CM2</button>
  </div>
</div>

<div class="main" id="main"></div>

<script>
// ==================== DATA ====================
const data = {
  cm1: {
    calcul: [
      { q: "Combien font 23 × 4 ?", ch: ["82", "92", "84", "72"], a: 1 },
      { q: "Combien font 150 – 67 ?", ch: ["93", "83", "73", "87"], a: 1 },
      { q: "Quel est le résultat de 6 × 7 ?", ch: ["36", "48", "42", "54"], a: 2 },
      { q: "Combien font 348 + 215 ?", ch: ["563", "553", "573", "543"], a: 0 },
      { q: "Combien font 64 ÷ 8 ?", ch: ["6", "7", "9", "8"], a: 3 },
      { q: "Quel est le triple de 24 ?", ch: ["62", "72", "68", "78"], a: 1 },
      { q: "Combien font 9 × 9 ?", ch: ["72", "81", "89", "79"], a: 1 },
      { q: "Combien font 500 – 135 ?", ch: ["365", "395", "375", "355"], a: 0 },
    ],
    fractions: [
      { q: "Quelle fraction représente une moitié ?", ch: ["1/4", "1/3", "1/2", "2/3"], a: 2 },
      { q: "Combien font 1/4 + 1/4 ?", ch: ["1/8", "1/2", "2/4 (= 1/2)", "1/4"], a: 2 },
      { q: "Quelle fraction est plus grande : 1/2 ou 1/3 ?", ch: ["1/3", "Elles sont égales", "1/2", "Impossible à dire"], a: 2 },
      { q: "Quelle fraction représente un quart ?", ch: ["2/8", "1/4", "1/3", "Les deux premières"], a: 3 },
      { q: "3/4, c'est combien de quarts ?", ch: ["3", "4", "7", "1"], a: 0 },
      { q: "Combien font 1/2 + 1/2 ?", ch: ["1/4", "2/4", "1", "1/2"], a: 2 },
      { q: "Laquelle de ces fractions est inférieure à 1 ?", ch: ["4/4", "5/4", "3/4", "6/4"], a: 2 },
      { q: "Quelle fraction correspond à 0,25 ?", ch: ["1/2", "1/4", "1/5", "2/5"], a: 1 },
    ],
    geometrie: [
      { q: "Combien de côtés a un carré ?", ch: ["3", "5", "6", "4"], a: 3 },
      { q: "Quel est le périmètre d'un carré de côté 5 cm ?", ch: ["20 cm", "25 cm", "15 cm", "10 cm"], a: 0 },
      { q: "Combien de faces a un cube ?", ch: ["4", "8", "5", "6"], a: 3 },
      { q: "Un triangle a combien de côtés ?", ch: ["4", "2", "3", "5"], a: 2 },
      { q: "Quel est le périmètre d'un rectangle 8 cm × 3 cm ?", ch: ["22 cm", "24 cm", "11 cm", "16 cm"], a: 0 },
      { q: "Combien de sommets a un carré ?", ch: ["2", "3", "6", "4"], a: 3 },
      { q: "Un angle droit mesure combien de degrés ?", ch: ["45°", "60°", "90°", "180°"], a: 2 },
      { q: "Quelle forme a 0 côté ?", ch: ["Triangle", "Cercle", "Carré", "Losange"], a: 1 },
    ],
    mesures: [
      { q: "Combien de centimètres dans 1 mètre ?", ch: ["10 cm", "1 000 cm", "100 cm", "1 00 cm"], a: 2 },
      { q: "Combien de grammes dans 1 kilogramme ?", ch: ["100 g", "10 000 g", "1 000 g", "500 g"], a: 2 },
      { q: "1 heure = combien de minutes ?", ch: ["30 min", "100 min", "90 min", "60 min"], a: 3 },
      { q: "Combien de millimètres dans 1 centimètre ?", ch: ["100 mm", "10 mm", "1 000 mm", "5 mm"], a: 1 },
      { q: "2 kg = combien de grammes ?", ch: ["200 g", "2 000 g", "20 000 g", "1 000 g"], a: 1 },
      { q: "Combien de secondes dans 1 minute ?", ch: ["100 s", "30 s", "60 s", "120 s"], a: 2 },
      { q: "1,5 m = combien de centimètres ?", ch: ["15 cm", "105 cm", "150 cm", "1 500 cm"], a: 2 },
      { q: "Combien de centilitres dans 1 litre ?", ch: ["10 cL", "1 000 cL", "100 cL", "50 cL"], a: 2 },
    ],
    problemes: [
      { q: "Tom a 35 billes. Il en donne 12 à sa sœur. Combien lui en reste-t-il ?", ch: ["23", "47", "13", "33"], a: 0 },
      { q: "Un paquet de gâteaux coûte 2 €. Julie en achète 4. Combien dépense-t-elle ?", ch: ["6 €", "10 €", "8 €", "12 €"], a: 2 },
      { q: "Une classe a 28 élèves. Ils se mettent en groupes de 4. Combien y a-t-il de groupes ?", ch: ["6", "8", "7", "9"], a: 2 },
      { q: "Léa a 45 autocollants. Elle en reçoit 23 de plus. Combien en a-t-elle ?", ch: ["68", "22", "78", "58"], a: 0 },
      { q: "Un livre a 96 pages. Théo en a lu 48. Combien lui en reste-t-il ?", ch: ["48", "144", "38", "58"], a: 0 },
      { q: "Il y a 5 rangées de 6 chaises. Combien y a-t-il de chaises en tout ?", ch: ["11", "25", "30", "36"], a: 2 },
      { q: "Un sac de bonbons en contient 40. On en mange 8. Combien en reste-t-il ?", ch: ["48", "22", "38", "32"], a: 3 },
      { q: "Paul marche 3 km chaque jour pendant 6 jours. Quelle distance parcourt-il ?", ch: ["9 km", "18 km", "12 km", "15 km"], a: 1 },
    ],
  },
  cm2: {
    calcul: [
      { q: "Combien fait 456 × 7 ?", ch: ["3 192", "3 812", "3 102", "2 952"], a: 0 },
      { q: "Quel est le résultat de 1 000 – 387 ?", ch: ["613", "623", "603", "713"], a: 0 },
      { q: "Combien font 48 ÷ 6 ?", ch: ["6", "7", "8", "9"], a: 2 },
      { q: "Combien font 25 × 4 ?", ch: ["90", "100", "80", "120"], a: 1 },
      { q: "Quel est le résultat de 3 456 + 2 789 ?", ch: ["6 245", "6 145", "6 345", "6 025"], a: 0 },
      { q: "Combien font 360 ÷ 9 ?", ch: ["30", "40", "45", "36"], a: 1 },
      { q: "Quel est le double de 347 ?", ch: ["694", "684", "714", "674"], a: 0 },
      { q: "Combien font 12 × 12 ?", ch: ["132", "124", "144", "148"], a: 2 },
    ],
    fractions: [
      { q: "Quelle fraction est équivalente à 1/2 ?", ch: ["2/3", "3/6", "4/6", "2/5"], a: 1 },
      { q: "Combien font 1/4 + 1/4 ?", ch: ["1/8", "1/2", "3/4", "2/8"], a: 1 },
      { q: "Quelle fraction est la plus grande ?", ch: ["3/4", "2/3", "5/8", "7/12"], a: 0 },
      { q: "Combien font 2/3 + 1/3 ?", ch: ["5/6", "1", "3/6", "4/6"], a: 1 },
      { q: "Quelle fraction correspond à 0,5 ?", ch: ["1/5", "5/10", "1/2", "2/5"], a: 2 },
      { q: "Combien font 3/4 – 1/4 ?", ch: ["1/4", "2/4 (= 1/2)", "3/8", "4/4"], a: 1 },
      { q: "Combien font 3 × 1/5 ?", ch: ["3/15", "1/5", "3/5", "5/3"], a: 2 },
      { q: "Quelle fraction est inférieure à 1/2 ?", ch: ["3/4", "5/8", "3/7", "2/3"], a: 2 },
    ],
    geometrie: [
      { q: "Combien de côtés a un hexagone ?", ch: ["5", "6", "7", "8"], a: 1 },
      { q: "Quel est le périmètre d'un carré de côté 8 cm ?", ch: ["32 cm", "24 cm", "64 cm", "16 cm"], a: 0 },
      { q: "Quelle est l'aire d'un rectangle de 6 cm × 4 cm ?", ch: ["20 cm²", "24 cm²", "22 cm²", "28 cm²"], a: 1 },
      { q: "Un triangle équilatéral a...", ch: ["2 côtés égaux", "3 côtés égaux", "1 angle droit", "4 côtés"], a: 1 },
      { q: "Combien de faces a un cube ?", ch: ["4", "8", "5", "6"], a: 3 },
      { q: "Quel est le périmètre d'un rectangle 10 cm × 5 cm ?", ch: ["50 cm", "15 cm", "30 cm", "20 cm"], a: 2 },
      { q: "Un angle droit mesure...", ch: ["45°", "180°", "90°", "60°"], a: 2 },
      { q: "Quelle est l'aire d'un carré de 7 cm de côté ?", ch: ["28 cm²", "49 cm²", "14 cm²", "56 cm²"], a: 1 },
    ],
    mesures: [
      { q: "Combien de centimètres dans 2,5 mètres ?", ch: ["25 cm", "250 cm", "2 500 cm", "205 cm"], a: 1 },
      { q: "Combien de grammes dans 3 kilogrammes ?", ch: ["30 g", "300 g", "3 000 g", "30 000 g"], a: 2 },
      { q: "Combien de minutes dans 2 heures et demie ?", ch: ["120 min", "140 min", "150 min", "180 min"], a: 2 },
      { q: "4 km = combien de mètres ?", ch: ["40 m", "400 m", "4 000 m", "40 000 m"], a: 2 },
      { q: "Combien de centilitres dans 1,5 litre ?", ch: ["15 cL", "150 cL", "1 500 cL", "1 050 cL"], a: 1 },
      { q: "Un film dure 1h 35 min, il commence à 14h10. À quelle heure finit-il ?", ch: ["15h35", "15h45", "15h55", "16h05"], a: 1 },
      { q: "Combien de secondes dans 5 minutes ?", ch: ["250 s", "300 s", "350 s", "500 s"], a: 1 },
      { q: "500 g + 1,5 kg = ?", ch: ["2 kg", "1,6 kg", "2,5 kg", "2 000 g"], a: 0 },
    ],
    problemes: [
      { q: "Marie a 24 bonbons. Elle en donne le quart à son frère. Combien lui reste-t-il ?", ch: ["6", "18", "12", "20"], a: 1 },
      { q: "Un livre coûte 8,50 €. Paul achète 3 livres. Combien dépense-t-il ?", ch: ["24,50 €", "25,50 €", "24,00 €", "26,50 €"], a: 1 },
      { q: "Un train roule à 120 km/h pendant 3 heures. Quelle distance parcourt-il ?", ch: ["360 km", "240 km", "420 km", "300 km"], a: 0 },
      { q: "Une classe de 30 élèves se répartit en groupes de 5. Combien y a-t-il de groupes ?", ch: ["5", "7", "6", "8"], a: 2 },
      { q: "Léa a économisé 45 €. Elle veut acheter un jouet à 68 €. Combien lui manque-t-il ?", ch: ["13 €", "23 €", "33 €", "43 €"], a: 1 },
      { q: "Un verger a 8 rangées de 12 pommiers. Combien y a-t-il de pommiers ?", ch: ["88", "96", "84", "102"], a: 1 },
      { q: "Tom marche 4 km par jour pendant 5 jours. Quelle distance parcourt-il ?", ch: ["16 km", "24 km", "20 km", "18 km"], a: 2 },
      { q: "Une boîte contient 48 chocolats. On en mange 15. Combien en reste-t-il ?", ch: ["33", "23", "43", "37"], a: 0 },
    ],
  }
};

const catLabels = { calcul: "Calcul", fractions: "Fractions", geometrie: "Géométrie", mesures: "Mesures", problemes: "Problèmes" };

// ==================== STATE ====================
let state = {
  view: "home",  // home | quiz | result
  level: null,   // cm1 | cm2
  cat: "calcul",
  questions: [],
  qIndex: 0,
  answered: false,
  scoreOk: 0,
  scoreKo: 0,
};

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

// ==================== RENDER ====================
function render() {
  const main = document.getElementById("main");
  const lb = document.getElementById("level-bar");
  document.getElementById("score-ok").textContent = state.scoreOk;
  document.getElementById("score-ko").textContent = state.scoreKo;

  if (state.view === "home") {
    lb.style.display = "none";
    main.innerHTML = `
      <div class="home-card">
        <div class="home-title">Entraîne-toi en Maths !</div>
        <div class="home-sub">Choisis ton niveau pour commencer les exercices.</div>
        <div class="level-cards">
          <div class="level-card l-cm1" onclick="chooseLevel('cm1')">
            <div class="level-card-label">CM1</div>
            <div class="level-card-desc">5 thèmes · 8 exercices chacun</div>
          </div>
          <div class="level-card l-cm2" onclick="chooseLevel('cm2')">
            <div class="level-card-label">CM2</div>
            <div class="level-card-desc">5 thèmes · 8 exercices chacun</div>
          </div>
        </div>
      </div>`;
    return;
  }

  // Show level bar
  lb.style.display = "block";
  document.getElementById("btn-cm1").className = "level-btn" + (state.level === "cm1" ? " cm1" : "");
  document.getElementById("btn-cm2").className = "level-btn" + (state.level === "cm2" ? " cm2" : "");

  if (state.view === "result") { renderResult(main); return; }
  renderQuiz(main);
}

function renderQuiz(main) {
  const lv = state.level;
  const qs = state.questions;
  const q = qs[state.qIndex];
  const pct = Math.round((state.qIndex / qs.length) * 100);

  const catHtml = Object.keys(catLabels).map(k =>
    `<button class="cat-pill${state.cat === k ? ` active-${lv}` : ''}" onclick="startCat('${k}')">${catLabels[k]}</button>`
  ).join("");

  const choicesHtml = q.ch.map((c, i) =>
    `<button class="choice-btn" id="ch${i}" onclick="answer(${i})">${c}</button>`
  ).join("");

  main.innerHTML = `
    <div class="cat-row">${catHtml}</div>
    <div class="q-card">
      <div class="q-meta">
        <div class="q-num">Q ${state.qIndex + 1} / ${qs.length}</div>
        <div class="progress-wrap"><div class="progress-fill fill-${lv}" style="width:${pct}%"></div></div>
        <div style="font-size:12px;font-weight:700;color:var(--text3)">${catLabels[state.cat]}</div>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="choices">${choicesHtml}</div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <button class="btn" onclick="home()">← Menu</button>
        <button class="btn primary-${lv}" id="next-btn" style="display:none" onclick="nextQ()">Question suivante →</button>
      </div>
    </div>`;
}

function renderResult(main) {
  const lv = state.level;
  const total = state.questions.length;
  const ok = state.scoreOk;
  const pct = Math.round((ok / total) * 100);
  const emoji = pct >= 80 ? "🌟" : pct >= 60 ? "👍" : pct >= 40 ? "💪" : "📚";
  const msg = pct >= 80 ? "Excellent travail, bravo !" : pct >= 60 ? "Bien joué, continue comme ça !" : pct >= 40 ? "Pas mal, continue à t'entraîner !" : "Courage, tu vas progresser !";

  main.innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score ${lv}">${ok} / ${total}</div>
      <div class="result-pct">${pct}% de bonnes réponses · ${catLabels[state.cat]}</div>
      <div class="result-msg">${msg}</div>
      <div class="result-btns">
        <button class="btn primary-${lv}" onclick="restartSame()">Recommencer</button>
        <button class="btn" onclick="home()">Changer de thème</button>
      </div>
    </div>`;
}

// ==================== ACTIONS ====================
function chooseLevel(lv) {
  state.level = lv;
  state.cat = "calcul";
  state.scoreOk = 0;
  state.scoreKo = 0;
  loadQuestions();
  state.view = "quiz";
  render();
}

function setLevel(lv) {
  state.level = lv;
  state.scoreOk = 0;
  state.scoreKo = 0;
  loadQuestions();
  state.view = "quiz";
  render();
}

function startCat(cat) {
  state.cat = cat;
  state.scoreOk = 0;
  state.scoreKo = 0;
  loadQuestions();
  state.view = "quiz";
  render();
}

function loadQuestions() {
  state.questions = shuffle(data[state.level][state.cat]).slice(0, 6);
  state.qIndex = 0;
  state.answered = false;
}

function answer(idx) {
  if (state.answered) return;
  state.answered = true;
  const q = state.questions[state.qIndex];
  const correct = q.a;
  const fb = document.getElementById("feedback");

  document.querySelectorAll(".choice-btn").forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct && i !== idx) btn.classList.add("reveal");
  });

  if (idx === correct) {
    document.getElementById("ch" + idx).classList.add("correct");
    fb.className = "feedback ok";
    fb.textContent = "✓ Bravo, bonne réponse !";
    state.scoreOk++;
  } else {
    document.getElementById("ch" + idx).classList.add("wrong");
    fb.className = "feedback ko";
    fb.textContent = "✗ Pas tout à fait. La bonne réponse était : " + q.ch[correct];
    state.scoreKo++;
  }
  document.getElementById("score-ok").textContent = state.scoreOk;
  document.getElementById("score-ko").textContent = state.scoreKo;
  document.getElementById("next-btn").style.display = "";
}

function nextQ() {
  state.qIndex++;
  state.answered = false;
  if (state.qIndex >= state.questions.length) {
    state.view = "result";
  }
  render();
}

function restartSame() {
  state.scoreOk = 0;
  state.scoreKo = 0;
  loadQuestions();
  state.view = "quiz";
  render();
}

function home() {
  state.view = "home";
  render();
}

// ==================== INIT ====================
render();
</script>
</body>
</html>
